name = "tophunt-api"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Production API hostname.
#
# `custom_domain = true` makes Cloudflare create/own the DNS record and the
# certificate for this hostname and route the whole host to this Worker — it is
# NOT a zone route pattern, so no `zone_name` is needed and nothing else on the
# zone can shadow it.
#
# Prerequisite: the `tophunt.in` zone must already exist in the same Cloudflare
# account, otherwise the deploy fails with "Could not find zone". The first
# deploy after adding this provisions the record; later deploys are no-ops.
#
# ---------------------------------------------------------------------------
# `workers_dev` MUST stay `true`, and MUST stay written down explicitly.
#
# This was previously left implicit with a comment claiming workers.dev was
# "enabled (the default)". It was not. Adding `routes` makes wrangler stop
# publishing the workers.dev route, so the first deploy after the custom domain
# landed took `tophunt-api.weadown-in.workers.dev` completely dark — every path
# on it answered Cloudflare error 1042 (no route) before the Worker even ran.
#
# That host is not legacy decoration. Two things still depend on it:
#
#  1. EVERY media url in D1 is absolute and still on `<that host>/media/...`
#     until scripts/media-domain-backfill.sql has been run. With the host dead,
#     every avatar, post, story, contest banner, deposit screenshot and blog
#     cover image in the product renders blank.
#  2. EVERY already-installed mobile build has that host baked in as
#     EXPO_PUBLIC_API_URL (eas.json, at the time it was built). Those apps do not
#     re-read config; they cannot reach the API at all until their users take an
#     `eas update`. This is the more serious half, and it is invisible from a
#     browser.
#
# So: not a default to rely on. `R2_LEGACY_BASE_URLS` below is the other half of
# the same compatibility promise, and the two must be removed together — after
# the backfill has run AND no build old enough to use this host is still in use.
# ---------------------------------------------------------------------------
workers_dev = true

# Preview URLs are per-version hostnames pointing at THIS Worker — production D1,
# production R2, production secrets. They default to the value of `workers_dev`,
# so re-enabling the line above would silently switch them on too. Off: an
# unauthenticated extra hostname onto production is not something to acquire as a
# side effect of a compatibility fix.
preview_urls = false

routes = [{ pattern = "api.tophunt.in", custom_domain = true }]

# Pin the bundler to this package's own tsconfig. Without this, esbuild walks up
# the monorepo and picks up the root tsconfig.json (which extends
# "expo/tsconfig.base" — not resolvable from the worker), emitting a build
# warning on every deploy.
tsconfig = "tsconfig.json"

# Bundle *.sql migration files as text so the Worker can auto-apply pending D1
# migrations at runtime (see src/db/autoMigrate.ts). This removes the need for a
# separate `wrangler d1 migrations apply` step in CI or before deploy.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Auto-discover migrations before bundling: scans migrations/*.sql and writes
# the static import list (src/db/migrations.generated.ts). Runs on every
# `wrangler deploy` / `wrangler dev`, including directly-connected Cloudflare
# Workers Builds — so a new .sql file needs no code changes.
[build]
command = "node scripts/gen-migrations.mjs"

# ---------------------------------------------------------------------------
# D1 database (replaces Firestore)
# Create with:  wrangler d1 create tophunt-db
# then paste the returned database_id below.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "tophunt-db"
database_id = "932ccd0f-190a-46df-bdf6-685926f524ff"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Backups: D1 "Time Travel" gives automatic point-in-time recovery for the
# last 30 days — no setup required. Useful ops commands:
#   Inspect current bookmark:   wrangler d1 time-travel info tophunt-db
#   Restore to a timestamp:     wrangler d1 time-travel restore tophunt-db --timestamp=<ISO8601>
#   Export a full snapshot:     wrangler d1 export tophunt-db --output=backup.sql --remote
# Recommendation: run a weekly `d1 export` to R2/off-site for long-term backups.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# R2 bucket (replaces AWS S3 for media)
# Create with:  wrangler r2 bucket create tophunt-media
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tophunt-media"

# ---------------------------------------------------------------------------
# KV namespaces (OTPs, settings cache, JWKS cache)
# Create with:  wrangler kv namespace create OTP_KV   (repeat for each)
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "OTP_KV"
id = "216735e0c3fa4bf6a66cc50daee45ac8"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "ea266f67c04a4287aee037a102c0c2e1"

# ---------------------------------------------------------------------------
# Durable Object for real-time WebSocket push (chat, notifications, live votes)
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

# Per-match vote aggregator (SQLite-backed). Counts votes in the DO and
# batch-flushes to D1, keeping the hot vote path off D1's single writer.
[[durable_objects.bindings]]
name = "VOTE_COUNTER"
class_name = "VoteCounter"

# Per-subject rate-limit counters (one instance per uid / IP / phone / email).
#
# Moved off KV. A read-then-write against an eventually-consistent store is not a
# counter — concurrent requests read the same value and each write value+1, so a
# burst spends one unit of budget and the real limit drifts UP with concurrency,
# which is backwards for a limiter. It also cost one KV write per check against a
# free-plan budget of 1,000/day shared with every cache in the app; Durable Objects
# allow 100,000 requests and 100,000 rows written per day.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Per-chat message store (SQLite-backed). Owns chat message bodies, one instance
# per chatId, so the unbounded message write path stays off D1's single writer.
[[durable_objects.bindings]]
name = "CHAT_ARCHIVE"
class_name = "ChatArchive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VoteCounter"]

# Per-subject rate-limit counters. Never edit v1/v2 — migration tags are applied
# once and recorded, so an edit changes nothing on this account and everything on a
# fresh one.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimiter"]

# Per-chat message store. Same rule: append a new tag, never edit an applied one.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["ChatArchive"]

# ---------------------------------------------------------------------------
# Queues — admin broadcast fan-out (src/lib/broadcast.ts + index.ts `queue()`).
#
# A broadcast enqueues one message, the consumer sends ONE page of recipients and
# re-enqueues the next, so a send-to-everyone drains in seconds instead of one page
# per 10-minute cron tick. The cron (drainBroadcastJobs) stays as a stale-job
# safety net, and the producer binding is read optionally, so the app keeps working
# if the queue is not yet created.
#
# CREATE ONCE before the first deploy that includes this:
#   wrangler queues create tophunt-broadcast
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "BROADCAST_QUEUE"
queue = "tophunt-broadcast"

[[queues.consumers]]
queue = "tophunt-broadcast"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# ---------------------------------------------------------------------------
# Scheduled tasks (replace Firebase onSchedule functions)
#   */10 * * * *  -> resolveContests + expired story cleanup (was `scheduled`/`resolveContestsTask`)
#   0 0 1 * *     -> monthlyHallOfFame
# ---------------------------------------------------------------------------
[triggers]
#   */10 * * * *  -> the operational sweep (settlement, refunds, video/deletion reconciliation)
#   0 * * * *     -> retention housekeeping (prune error_logs / notifications / ops tables).
#                    Split OFF the 10-min tick: retention is not time-critical and does not
#                    need to run 144x/day. Hourly is plenty, and it keeps the frequent tick
#                    focused on money/settlement work.
#   0 */6 * * *   -> SEO audit. Has its OWN schedule on purpose, see below.
#   0 0 1 * *     -> monthlyHallOfFame
#
# The SEO audit is not on the 10-minute tick. It was, and it never ran once: a
# Worker invocation has a hard subrequest ceiling (50 on this plan — independently
# confirmed by the sitemap walk stopping at exactly 49 API pages), the sweep
# already spends most of it on D1, and the audit adds ~21 more. It blew the limit
# every time. Worse, it could not even report that: `runCronJob` records a failure
# row, and writing that row is itself a subrequest, so the failure was unrecordable
# and the job simply showed as "never ran".
#
# Its own trigger gives it a fresh budget — and means a future failure IS recorded
# instead of vanishing.
crons = ["*/10 * * * *", "0 * * * *", "0 */6 * * *", "0 0 1 * *"]

# ---------------------------------------------------------------------------
# Workers Logs.
#
# This is OPT-IN. Without this block the structured JSON log line the Worker
# emits per request (src/index.ts) is only visible in a live `wrangler tail`
# session — nothing is retained and nothing is searchable, which is not much use
# when you need to explain what happened an hour ago.
#
# head_sampling_rate = 1 keeps every log. Lower it if invocation volume makes
# that expensive; errors are additionally persisted to D1 (`error_logs`) and
# forwarded to Sentry, so they survive sampling either way.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

# ---------------------------------------------------------------------------
# Staging environment.
#
# There was no non-production environment at all: one D1, one R2, one KV pair,
# one Firebase project. Because the Worker auto-applies pending migrations on the
# first request of every isolate (src/db/autoMigrate.ts), production WAS the
# migration test bed — a bad migration had nowhere to fail first.
#
# BEFORE FIRST USE, create the staging resources and paste their ids below:
#   wrangler d1 create tophunt-db-staging
#   wrangler r2 bucket create tophunt-media-staging
#   wrangler kv namespace create OTP_KV --env staging
#   wrangler kv namespace create CACHE_KV --env staging
# Then set the staging secrets:  wrangler secret put <NAME> --env staging
# Deploy with:                   wrangler deploy --env staging
#
# The ids are intentionally left as placeholders rather than pointing at the
# production resources: a staging deploy that silently wrote to the production
# database would be far worse than one that fails fast.
# ---------------------------------------------------------------------------
[env.staging]
name = "tophunt-api-staging"

# MUST be present and empty. `routes` is an INHERITABLE key in wrangler config:
# without this line the staging environment inherits the top-level
# `api.tophunt.in` custom domain, and `wrangler deploy --env staging` would
# repoint the production API hostname at the staging Worker — pointing real
# users' traffic at the staging database. Staging is reached on its
# workers.dev host instead.
#
# CONSEQUENCE WORTH KNOWING, now that the read caches are edge-only (lib/edgeCache.ts):
# the Cloudflare Cache API only does real work for a Worker on a CUSTOM DOMAIN, so with
# no route here staging has NO shared read cache at all — every request to every cached
# endpoint recomputes from D1. Two things follow:
#
#   1. Staging's D1 read volume is higher than production's by whatever the cache hit
#      rate is. Fine for a low-traffic environment, and the queries are indexed and
#      small, but it is not a like-for-like performance rehearsal.
#   2. Cache behaviour and the colo-local invalidation tails CANNOT be exercised here.
#      A staging pass proves correctness-without-cache; it does not prove that a purge
#      reaches the right entry. That is what apps/worker/test/edgeCache.test.ts is for,
#      since it installs a Cache API stub that really stores.
#
# Giving staging its own hostname on the zone (e.g. a `staging-api.tophunt.in` custom
# domain) would restore both. Deliberately not done here: it is a DNS/zone change, and
# the existing comment's warning about `routes` inheritance is the reason to be careful
# with this key at all.
routes = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "tophunt-db-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "tophunt-media-staging"

[[env.staging.kv_namespaces]]
binding = "OTP_KV"
id = "REPLACE_WITH_STAGING_OTP_KV_ID"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_STAGING_CACHE_KV_ID"

[[env.staging.durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[env.staging.durable_objects.bindings]]
name = "VOTE_COUNTER"
class_name = "VoteCounter"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.durable_objects.bindings]]
name = "CHAT_ARCHIVE"
class_name = "ChatArchive"

# Staging broadcast queue. Create once:  wrangler queues create tophunt-broadcast-staging
[[env.staging.queues.producers]]
binding = "BROADCAST_QUEUE"
queue = "tophunt-broadcast-staging"

[[env.staging.queues.consumers]]
queue = "tophunt-broadcast-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[env.staging.observability]
enabled = true
head_sampling_rate = 1

# Staging runs the same cron schedule so scheduled work is exercised too.
[env.staging.triggers]
crons = ["*/10 * * * *", "0 * * * *", "0 */6 * * *", "0 0 1 * *"]

[env.staging.vars]
FIREBASE_PROJECT_ID = "tophuntdpcontest-staging"
# Staging keeps media on the Worker proxy: there is no staging custom domain, and
# a second R2 custom domain is not worth a hostname. The host here was previously
# "tophunt-api-staging.workers.dev", which does not resolve — workers.dev hosts
# are always `<worker>.<account-subdomain>.workers.dev`, so every staging upload
# was handed back a dead url.
R2_PUBLIC_BASE_URL = "https://tophunt-api-staging.weadown-in.workers.dev/media"
# Nothing to keep compatible on staging; its bucket is disposable.
R2_LEGACY_BASE_URLS = ""
# Cannot be enabled on a *.workers.dev host with a /media path prefix — see the
# production block. Staging therefore always serves originals.
MEDIA_TRANSFORMATIONS = "false"
BUNNY_CDN_HOSTNAME = ""
# Staging shares the same free-plan KV quota as production (the limit is
# per-ACCOUNT, not per-namespace), so a test run here can take production's cache
# writes down with it. Off by default so staging behaves like production; flip to
# "true" for a heavy session. See the production block for the full scope.
KV_WRITES_DISABLED = "false"
SENTRY_ENVIRONMENT = "staging"
# Pages preview deployments get a per-commit subdomain, so they cannot be pinned
# to an exact origin list. Staging is the environment where that is acceptable —
# production keeps its explicit allow-list.
ALLOWED_ORIGINS = "http://localhost:5000,http://localhost:8081,https://tophuntdpcontest-89t.pages.dev,https://tophunt-admin-panel.pages.dev"

# ---------------------------------------------------------------------------
# Non-secret vars. Secrets (service account, R2 keys, Twilio, email) are set
# via `wrangler secret put <NAME>` — see apps/worker/.dev.vars.example
# ---------------------------------------------------------------------------
[vars]
FIREBASE_PROJECT_ID = "tophuntdpcontest"

# Capacity widget (admin dashboard) — account + D1 ids for the Cloudflare GraphQL
# Analytics query that reports today's live rows_read / rows_written. NOT secret.
# The read-only token is a SECRET, set separately with:
#   wrangler secret put CF_ANALYTICS_TOKEN
# Without the token the widget still shows table growth + storage (fail-open).
CF_ACCOUNT_ID = "8357be8f9dba5721b6b726faff763f0f"
CF_D1_DATABASE_ID = "932ccd0f-190a-46df-bdf6-685926f524ff"

# Scale tier — how the Worker tunes itself for the Cloudflare FREE vs Workers PAID
# plan. See src/lib/scale.ts and SCALE_TIER.md. Three values:
#
# "auto" (DEPLOYED DEFAULT): self-adapts to BOTH billing directions with NO code,
#   flag, or deploy change at the transition. It caches the per-request auth
#   account-state in KV — on paid the writes succeed (optimal); on free, once the
#   KV write budget is spent the writes fail open and the request recomputes from
#   D1 (never breaks). Block/revocation still take effect immediately because
#   invalidation is a KV DELETE (metered separately). So you upgrade/downgrade the
#   Cloudflare plan and the app just follows — nothing to flip.
#
# "paid": force the auth-state cache on (for a paid account that wants it explicit).
# "free": force it OFF — guarantees zero auth-cache KV writes, best for a LARGE
#   free deployment that wants the whole KV budget for other caches.
#
# An unset or unrecognised value resolves to "free" (the never-write-extra tier),
# so a typo can never change behaviour unsafely.
SCALE_TIER = "auto"

# Public media origin — the R2 bucket's own custom domain, NOT the Worker.
#
# Serving media straight from R2 removes a Worker invocation per image, lets the
# CDN satisfy the ranged requests video players make (which the Worker route has
# to bypass the cache for — see index.ts), and is a zone root, which is the one
# thing `/cdn-cgi/image/` needs in order to resolve at all.
#
# Prerequisite: R2 -> bucket `tophunt-media` -> Settings -> Public access ->
# Custom domain -> media.tophunt.in.
R2_PUBLIC_BASE_URL = "https://media.tophunt.in"

# Media bases this deployment ALSO owns, comma-separated.
#
# Media urls are stored ABSOLUTE in D1 (lib/r2.ts), so changing
# R2_PUBLIC_BASE_URL does not rewrite existing rows. Those rows keep loading
# (the Worker's /media/* route stays), but the url -> R2-key mapping that guards
# every delete would stop recognising them, and an unrecognised url means the
# object is silently never deleted — orphaned bytes accrue forever, and a
# contest banner or battle card is left readable after its record is gone.
#
# Listing the old base here keeps `deleteByPublicUrl`,
# `contestBannerKeyFromPublicUrl` and `vsImageKeyFromPublicUrl` correct for both
# hosts. Keep it until `scripts/media-domain-backfill.sql` has been run AND no
# app build old enough to have written such a url is still in the wild.
R2_LEGACY_BASE_URLS = "https://tophunt-api.weadown-in.workers.dev/media"

# Cloudflare Transformations (Image Resizing) switch for the media origin.
#
# ENABLED. Both halves of the prerequisite are now satisfied:
#
#   CODE     — lib/media.ts -> transformationsAvailable(): media.tophunt.in is a
#              real zone host (not *.workers.dev) and has no path prefix.
#   DASHBOARD — Transformations is enabled on zone tophunt.in. Verified against
#              production rather than assumed, because no deploy can assert it:
#
#     $ curl -sI "https://media.tophunt.in/cdn-cgi/image/width=320,quality=70,\
#         format=auto/blog/imported/<sha>.jpg"
#     HTTP/2 200
#     cf-resized: internal=ok/h q=0 n=12+0 c=2+7 v=2026.8.6 l=5999 f=true
#     content-length: 5999          # original is 13875
#
#   The `cf-resized` response header is the proof: it is only emitted when the
#   resizing pipeline actually ran. Re-running that curl is the check to repeat
#   before ever trusting this flag again.
#
# Why the order matters, if this is ever revisited: `/cdn-cgi/image/...` on a
# zone WITHOUT Transformations enabled does not fall back to the original — it
# ERRORS. Setting this "true" before the dashboard is done turns every thumbnail,
# feed image and avatar in the product into a broken image the moment the Worker
# deploys, i.e. a config flag would own an outage. Never flip this on the
# strength of the code preconditions alone.
#
# Rollback is this line back to "false" plus a deploy: every helper in
# lib/media.ts then returns the ORIGINAL url again and mediaUrlThumb ==
# mediaUrl. No client release is needed in either direction — that is the whole
# point of the indirection, and the Expo client reads every variant field with an
# `|| mediaUrl` fallback.
#
# COST: transformations are billed per unique transformation beyond the free
# monthly allowance. Bounded here by content-hashed / UUID keys and a fixed set
# of three variants (320/1080/128), so the unique count tracks distinct images
# and not requests, and repeat views are cache hits. Worth watching in
# Cloudflare -> Images -> Transformations after this ships.
MEDIA_TRANSFORMATIONS = "true"

# Bunny Stream pull-zone hostname, e.g. "vz-1a2b3c4d-e5f.b-cdn.net".
# Not a secret. Empty disables the Bunny path entirely: `createVideoUpload` is
# rejected and video uploads keep using the existing R2 flow, so this is safe to
# deploy before the Bunny account exists.
# The API key and library id are SECRETS — `wrangler secret put`, never here.
BUNNY_CDN_HOSTNAME = ""

# ---------------------------------------------------------------------------
# KV write kill switch. TESTING ONLY — keep this "false" in production.
#
# The Workers FREE plan allows 100,000 KV reads but only 1,000 KV WRITES per day,
# and once the write quota is gone every `put` returns 429 until 00:00 UTC. That
# is not a theoretical limit: with no real users at all, one person exercising the
# app exhausted it in about three hours and Cloudflare emailed to say KV was
# blocked. Reads were at 17.5k of 100k — under 1% — while writes were the whole
# budget, because several caches here were being written once per REQUEST rather
# than once per value.
#
# Set to "true" to run a test session far below the quota: every cache read misses
# and the value is recomputed from D1, which is the fail-open path those caches
# already take when KV is unavailable. The app works; it is just uncached.
#
# It affects the read-through CACHES and NOTHING ELSE. In particular it does not
# switch off:
#
#   - Anything in OTP_KV. OTP codes, per-recipient send cooldowns, re-auth grants
#     and the password-reset verified flag must persist or auth breaks — and one
#     of those breakages would be a password reset that no longer needs proof.
#   - RATE LIMITING, of any kind — its counters are in the RateLimiter Durable
#     Object now, not in KV, so this flag cannot reach them. The first version of
#     it skipped every rate-limit counter without `failClosed: true`, on the
#     reasoning that those are only engagement throttles. That was wrong:
#     `failClosed` means "refuse if the counter is unreadable", NOT "this guard
#     protects money", and several throttles that do guard money or real spend are
#     fail-open by omission — deposits, rewarded ads (which mint withdrawable
#     coins), video uploads (Bunny transcode spend), the only per-IP signup limit,
#     and the PII data export.
#   - The Firebase access token and JWKS caches, or the `rzp_order` payment
#     intent. Those write through env.CACHE_KV.put directly: they are state, not
#     cache, and dropping them would break sign-in and top-ups.
#
# The real fix for production is the Workers Paid plan ($5/mo — 1M writes/day);
# this switch is what makes testing on the free plan possible in the meantime. See
# lib/cache.ts `kvWritesDisabled` for the code path.
# ---------------------------------------------------------------------------
KV_WRITES_DISABLED = "false"

# CORS allow-list (comma-separated, exact origin match — no wildcards).
#
# This was previously "*", i.e. wide-open CORS on an API that moves wallets,
# deposits and withdrawals.
#
# Exactly the two production browser origins:
#   https://tophunt.in        user web app (apex — there is no `app.` host)
#   https://admin.tophunt.in  admin panel
#
# `https://www.tophunt.in` is NOT here, and should not be added back unless a www
# record is actually created. There is no such DNS record — it is NXDOMAIN — so no
# browser can ever send that Origin, and an allow-list entry for a host that
# cannot exist is not harmless: it is a claim about the deployment that a reader
# will believe. If a www redirect is ever added, note that a redirect does not
# help a `fetch()` — a request that STARTS on www sends that origin — so the
# entry would have to come back at the same time.
#
# The `*.pages.dev` origins are intentionally GONE. Keeping them would leave the
# unauthenticated-domain path to this API open after cutover, and Pages serves
# the same build on both hosts, so nothing legitimate needs them once DNS is
# live. Re-add them temporarily ONLY if you need to run old and new hosts in
# parallel during the switch, and remove them again afterwards.
#
# Native iOS/Android builds send no Origin header, so this only affects the web
# app and the admin panel. Pages *preview* deployments get per-commit subdomains
# and can therefore never be allowed against production — point them at the
# staging Worker instead.
#
# For local development, override this in `.dev.vars` (which takes precedence
# over these vars under `wrangler dev`) rather than adding localhost here.
ALLOWED_ORIGINS = "https://tophunt.in,https://admin.tophunt.in"
