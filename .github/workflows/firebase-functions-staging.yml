name: Firebase Functions - Staging Build & Test

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/functions/**'
      - '.github/workflows/firebase-functions-staging.yml'

jobs:
  build_and_test_firebase_staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: ./apps/functions
        run: npm install

      - name: Build Functions
        working-directory: ./apps/functions
        run: npm run build

      - name: Run Tests (Optional)
        # If you have a test script, you can add it here.
        # Example:
        # working-directory: ./apps/functions
        # run: npm test
        run: echo "Skipping tests, no test script found."
