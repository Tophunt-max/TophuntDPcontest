name: Cloudflare Worker - Production Deployment

# Deploys the Worker backend AND auto-applies any pending D1 migrations.
# `wrangler d1 migrations apply` tracks applied migrations in the remote
# `d1_migrations` table, so it only runs new ones and is safe to run every deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/worker/**'
      - '.github/workflows/worker-production.yml'
  workflow_dispatch: {}

jobs:
  deploy_worker_production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/worker
    env:
      # Token needs: Workers Scripts:Edit, D1:Edit, Account Settings:Read.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply D1 migrations (auto)
        run: npx wrangler d1 migrations apply tophunt-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy
