name: CI

# Production gate. Both apps block merges on any type or test regression. The
# worker type-checks fully; the Expo app type-checks our own code (a few
# third-party packages ship React-19-incompatible source that we can't fix, so
# scripts/typecheck.mjs ignores node_modules errors only).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  worker:
    name: Worker (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  expo:
    name: Expo (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Gates on OUR app code being type-clean; ignores unfixable third-party
      # node_modules type errors (see scripts/typecheck.mjs).
      - run: npm run typecheck
      - run: npm test
