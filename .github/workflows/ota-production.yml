name: Expo OTA - Production Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/expo/**'
      - '.github/workflows/ota-production.yml'

jobs:
  ota_production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/expo/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-cache: true
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./apps/expo
        run: npm install

      - name: Publish to Production Channel
        working-directory: ./apps/expo
        run: eas update --branch production --message "$(git log -1 --pretty=%B)" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
