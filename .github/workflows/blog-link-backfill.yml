name: Blog internal link backfill

# Rewrite doubled internal links inside imported article bodies:
#
#   https://tophunt.in/blog/blog/<slug>/  ->  https://tophunt.in/<slug>
#
# See apps/worker/scripts/blog-link-backfill.sql for what is wrong and why. The
# short version: nothing serves the doubled path, it answered 200 with
# `noindex, nofollow`, and there are roughly eight such links in every one of
# ~4,400 imported posts — so the entire catalogue's internal link graph pointed at
# pages that refused to be indexed.
#
# NOT URGENT, AND NOTHING BREAKS IF IT NEVER RUNS. The edge Worker already repairs
# these links at render time (`normalizeContentLinks`) and 301s the doubled path
# onto the root permalink. This is data hygiene: it removes a redirect hop on every
# internal link and makes what the app renders from the API match what the Worker
# serves to crawlers.
#
# WHY A WORKFLOW AND NOT A MIGRATION — migrations in apps/worker/migrations are
# applied automatically on the first request to a fresh isolate, so as a migration
# this would rewrite the `content` column of ~4,400 rows, tens of megabytes of HTML,
# inside a live user request. A failure there fails `ensureMigrated`, which runs
# before request handling — taking the API down and retrying forever. It has to be
# a deliberate, operator-gated action.
#
# `workflow_dispatch` ONLY. Never on push, never on a schedule.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = read-only counts. backfill = rewrite the links.'
        type: choice
        required: true
        default: report
        options:
          - report
          - backfill
      confirm:
        description: 'For backfill ONLY: type BACKFILL to confirm. Ignored for report.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Two of these running at once would race on the same rows.
concurrency:
  group: blog-link-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json

      - run: npm ci

      # Fail before touching anything if the confirmation is missing. Checked
      # first so a mistyped dispatch cannot get as far as reading the database.
      - name: Require explicit confirmation for a write
        if: inputs.mode == 'backfill'
        # Through env, not `${{ }}` inside the script: a free-text input
        # interpolated into a shell command is a script-injection hole, and this
        # job holds a Cloudflare token with D1 write access.
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "BACKFILL" ]; then
            echo "::error::mode=backfill requires confirm=BACKFILL. Nothing was changed."
            exit 1
          fi
          echo "Confirmed."

      - name: Count the doubled links
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute tophunt-db --remote \
            --file=scripts/blog-link-report.sql | tee /tmp/before.txt

      # Note the restore point BEFORE mutating. D1 Time Travel covers 30 days, but
      # only if someone knows which bookmark to go back to — and the moment after a
      # bad rewrite of every article body is the worst time to be looking for it.
      - name: Record a Time Travel restore point
        if: inputs.mode == 'backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 time-travel info tophunt-db | tee /tmp/bookmark.txt

      - name: Rewrite the links
        if: inputs.mode == 'backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute tophunt-db --remote \
            --file=scripts/blog-link-backfill.sql

      - name: Confirm every count is now zero
        if: inputs.mode == 'backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute tophunt-db --remote \
            --file=scripts/blog-link-report.sql | tee /tmp/after.txt

      - name: Summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "## Blog internal link backfill — \`$MODE\`"
            echo
            echo "### Doubled links before"
            echo '```'
            cat /tmp/before.txt 2>/dev/null || echo '(not run)'
            echo '```'
            if [ "$MODE" = "backfill" ]; then
              echo "### Doubled links after"
              echo '```'
              cat /tmp/after.txt 2>/dev/null || echo '(not run)'
              echo '```'
              echo "### Rollback"
              echo 'D1 Time Travel, using the bookmark recorded before the rewrite:'
              echo '```'
              cat /tmp/bookmark.txt 2>/dev/null || echo '(not recorded)'
              echo '```'
              echo 'Nothing user-visible depends on this: the edge Worker normalises these'
              echo 'links at render time and 301s the doubled path either way.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
